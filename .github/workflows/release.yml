name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release All Platforms
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b1d99d697d2d6070736f8649737db0" > "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Install Zip & Utilities
        run: |
          which zip || brew install zip

      - name: Build All Platforms, Browser Extensions & Android
        run: |
          chmod +x ./build_all.sh ./build_app.sh ./build_dmg.sh ./build_extensions.sh ./build_android.sh ./android/gradlew
          ./build_all.sh

      - name: Archive macOS .app
        run: |
          cd dist
          zip -q -r -y "OE-Watcher-macOS.zip" "OE Watcher.app"
          echo "macOS archive created: dist/OE-Watcher-macOS.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OE Watcher ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/OE-Watcher-macOS.dmg
            dist/OE-Watcher-macOS.zip
            dist/oe-watcher-linux-amd64
            dist/oe-watcher-linux-arm64
            dist/oe-watcher-windows-amd64.exe
            dist/oe-watcher-windows-arm64.exe
            dist/oe-watcher-chrome.zip
            dist/oe-watcher-firefox.xpi
            dist/oe-watcher-firefox.zip
            dist/oe-watcher-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
